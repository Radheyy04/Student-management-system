{% extends "base.html" %}
{% block title %}Mark Attendance {% endblock %}

{% block content %}
<div style="max-width: 620px;">
    <div class="page-header animate">
        <p class="eyebrow">Attendance Entry</p>
        <h1>Mark Attendance</h1>
        <p>Select student details and mark attendance status.</p>
    </div>

    <div class="card animate">
        <form method="POST" action="/attendance">


            <div class="form-group">
                <label for="student_id">Student</label>
                <select id="student_id" name="student_id" required>
                    <option value="">Select a Student</option>
                    {% for s in students %}
                        <option value="{{ s[0] }}">{{ s[1] }} (ID: {{ s[0] }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="attendance_date">Date</label>
                <input type="date" id="attendance_date" name="attendance_date" required>
            </div>

            <div class="form-group">
                <label for="status">Attendance Status</label>
                <select id="status" name="status" required>
                    <option value="">Select Status</option>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                </select>
            </div>

            <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
                <button type="submit" class="btn btn-primary" style="flex:1; justify-content:center; padding:0.75rem;">
                    <svg width="14" height="14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Save Attendance
                </button>
                <a href="/" class="btn btn-ghost">Cancel</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
